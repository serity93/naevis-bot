services:
  bot:
    build: .
    image: naevis-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://naevis:naevis@postgres:5432/naevis
    volumes:
      - ./tokens:/app/tokens
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: naevis
      POSTGRES_PASSWORD: naevis
      POSTGRES_DB: naevis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naevis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
