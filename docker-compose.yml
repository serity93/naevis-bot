services:
  bot:
    build: .
    image: naevis-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://naevis:naevis@postgres:5432/naevis
      # Set here rather than in .env for the same reason DATABASE_URL is: the
      # value differs between `npm run dev` (localhost) and the container.
      # environment: overrides env_file:, so .env keeps the dev-friendly one.
      AI_BASE_URL: http://ollama:11434
    volumes:
      - ./tokens:/app/tokens
    depends_on:
      postgres:
        condition: service_healthy
      # Ordering only, deliberately not service_healthy. AI chat is fail-soft
      # by design, and a slow model load must not hold chat commands hostage.
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Note the absence of a ports: block. Ollama has no authentication of any
    # kind, so it stays on the compose network where only the bot can reach it.
    # Use `docker compose exec ollama ...` for admin rather than publishing it.
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # A model reload costs 5-15s on modest hardware, so keep it warm.
      OLLAMA_KEEP_ALIVE: 30m
      # One generation at a time. A 4GB card doesn't run two in parallel, it
      # runs both slower and risks spilling the KV cache out of VRAM. Paired
      # with the semaphore in src/core/ai/limits.ts.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: naevis
      POSTGRES_PASSWORD: naevis
      POSTGRES_DB: naevis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naevis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  ollama-models:
